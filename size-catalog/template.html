<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラサイズ一覧 | とうふブラザーズ</title>
<style>
:root{color-scheme:dark;--bg:#101925;--panel:#192738;--line:#31465a;--muted:#afc1d3;--gold:#f4cd7a;--blue:#85caff;font-family:system-ui,"Yu Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf5fc}header,main{max-width:1720px;margin:auto;padding:28px}header{padding-bottom:18px}h1{font-size:clamp(25px,3vw,36px);margin:6px 0 12px;letter-spacing:.04em}p{line-height:1.8;margin:8px 0;color:var(--muted);font-size:14px}.eyebrow{font-size:11px;color:var(--blue);letter-spacing:.25em}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}.legend span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 13px;font-size:12px}.legend b{color:var(--gold);margin-right:7px}.legend em{font-style:normal;color:#fff;margin-left:9px;font-variant-numeric:tabular-nums}.toolbar{position:sticky;top:0;z-index:2;background:#101925f5;border-block:1px solid var(--line);backdrop-filter:blur(8px);padding:15px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}input,select,button{font:inherit;color:inherit;background:#203146;border:1px solid #4b657d;border-radius:6px;padding:9px 11px;min-height:40px}input[type=search]{width:260px;max-width:100%}input[type=checkbox]{accent-color:var(--blue);min-height:initial}label{font-size:12px;display:flex;align-items:center;gap:7px}button{cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#count{margin-left:auto;color:var(--blue);font-size:13px;font-variant-numeric:tabular-nums}main{padding-top:18px}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min,230px),1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px 0}.card h2{font-size:15px;line-height:1.35;margin:0}.number{color:var(--muted);font-size:10px;display:block;margin-bottom:4px}.tier{white-space:nowrap;font-size:12px;color:var(--gold);border:1px solid #665a43;background:#302d28;padding:4px 7px;border-radius:5px}.stage{position:relative;margin:15px 14px 0;border:1px solid #3b5167;border-radius:5px;background-color:#132131;background-image:linear-gradient(to top,#5b759230 1px,transparent 1px);background-position:left bottom 23px;background-size:100% 10px;overflow:hidden}.floor{position:absolute;bottom:23px;left:0;right:0;height:1px;background:#a6bed0}.sprite{position:absolute;left:50%;transform:translateX(-50%);max-width:none;object-fit:contain;image-rendering:auto}.ruler{position:absolute;left:5px;color:#8da8bf;font:9px ui-monospace,monospace;line-height:1;z-index:1}.metrics{padding:12px 14px 15px;display:grid;gap:5px}.metrics strong{font-size:18px;color:#fff;font-variant-numeric:tabular-nums}.metrics small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.metrics .id{color:#7592ac;font-size:10px}.empty{padding:50px;text-align:center;color:var(--muted)}footer{padding:28px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}@media(max-width:650px){header,main{padding:18px}.toolbar{padding:12px 18px;gap:8px}#count{width:100%;margin-left:0}.legend{gap:5px}.legend span{padding:7px 9px}.catalog{gap:12px}}@media print{.toolbar{position:static}body{background:#fff}.card{break-inside:avoid}.catalog{grid-template-columns:repeat(3,minmax(230px,1fr))}header,main{max-width:none}.card{print-color-adjust:exact}}
</style></head><body>
<header><div class="eyebrow">TOFU BROS. / SIZE CATALOG</div><h1>キャラサイズ一覧</h1><p>全員を同じ倍率・同じ足元の線で比較できます。<b>等倍ではゲーム座標の1pxを画面の1px</b>で表示します（カメラ倍率1.0相当）。ゲーム中はカメラや画面サイズで拡大・縮小されます。</p><p>「基準」はサイズ設定の高さ。「画像」は待機の実描画を測った幅×高さで、武器・帽子・翼などを含みます。元の立ち姿と縦横比をそのまま使っています。</p><div class="legend"><span><b>1</b>子供<em>78px</em></span><span><b>2</b>女性・小柄な男性<em>94px</em></span><span><b>3</b>男性<em>98px</em></span><span><b>4</b>大男<em>124px</em></span><span><b>5</b>モンスター級<em>144px</em></span><span>個別：特殊な体型・種族</span></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="名前・キャラIDで検索" aria-label="キャラ名で検索"><label>サイズ<select id="tier"><option value="all">すべて</option><option value="1">1 · 78px</option><option value="2">2 · 94px</option><option value="3">3 · 98px</option><option value="4">4 · 124px</option><option value="5">5 · 144px</option><option value="special">個別サイズ</option></select></label><label>並び順<select id="sort"><option value="roster">キャラ選択順</option><option value="height">基準の高さが大きい順</option><option value="tier">サイズ段階順</option></select></label><label>倍率<select id="zoom"><option value="1">1× · 等倍</option><option value="2">2× · 拡大</option></select></label><label><input id="forms" type="checkbox" checked>変身専用も表示</label><button id="csv">数値をCSV保存</button><span id="count" role="status"></span></div>
<main><div id="catalog" class="catalog"></div><div id="empty" class="empty" hidden>条件に合うキャラがいません。</div></main><footer id="stamp"></footer>
<script id="size-catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
'use strict';
const catalogData=JSON.parse(document.getElementById('size-catalog-data').textContent),$=id=>document.getElementById(id),num=n=>Number.isInteger(n)?String(n):n.toFixed(1);let visible=[];
function render(){const q=$('search').value.trim().toLocaleLowerCase(),tier=$('tier').value,zoom=+$('zoom').value;visible=catalogData.characters.filter(r=>(!q||(r.name+' '+r.id).toLocaleLowerCase().includes(q))&&(tier==='all'||(tier==='special'?!r.tier:r.tier===+tier))&&($('forms').checked||!r.hidden));if($('sort').value==='height')visible.sort((a,b)=>b.targetHeight-a.targetHeight||a.order-b.order);if($('sort').value==='tier')visible.sort((a,b)=>(a.tier||6)-(b.tier||6)||a.order-b.order);
 const grid=$('catalog');grid.replaceChildren();const maxWidth=Math.max(180,...visible.map(r=>r.width)),height=Math.ceil(Math.max(170,...visible.map(r=>r.baseline-r.top))+18)*zoom+24;grid.style.setProperty('--card-min',Math.max(230,maxWidth*zoom+40)+'px');
 for(const r of visible){const card=document.createElement('article');card.className='card';card.dataset.id=r.id;card.dataset.tier=r.tier||'special';const head=document.createElement('div');head.className='card-head';const title=document.createElement('h2'),number=document.createElement('span');number.className='number';number.textContent=r.hidden?'変身専用':String(r.displayNumber).padStart(3,'0');title.append(number,document.createTextNode(r.name));const badge=document.createElement('span');badge.className='tier';badge.textContent=r.tier?'サイズ '+r.tier:'個別';head.append(title,badge);
 const stage=document.createElement('div');stage.className='stage';stage.style.height=height+'px';const floor=document.createElement('div');floor.className='floor';stage.append(floor);for(let y=0;y<=height-24;y+=50*zoom){const tick=document.createElement('span');tick.className='ruler';tick.style.bottom=24+y+'px';tick.textContent=y/zoom+'px';stage.append(tick);}const img=document.createElement('img');img.className='sprite';img.alt=r.name+'の待機姿';img.src=r.image;img.width=r.width*zoom;img.height=r.height*zoom;img.style.width=r.width*zoom+'px';img.style.height=r.height*zoom+'px';img.style.bottom=24-(r.bottom-r.baseline)*zoom+'px';stage.append(img);
 const metrics=document.createElement('div');metrics.className='metrics';const strong=document.createElement('strong');strong.textContent='基準 '+num(r.targetHeight)+'px';const dimensions=document.createElement('small');dimensions.textContent='画像 '+r.width+' × '+r.height+'px（武器込み）';const id=document.createElement('span');id.className='id';id.textContent=r.id;metrics.append(strong,dimensions,id);card.append(head,stage,metrics);grid.append(card);}
 $('count').textContent=visible.length+' / '+catalogData.characters.length+' 体・形態 · '+zoom+'×';$('empty').hidden=visible.length!==0;}
for(const id of['search','tier','sort','zoom','forms'])$(id).addEventListener(id==='search'?'input':'change',render);
$('csv').onclick=()=>{const quote=s=>'"'+String(s??'').replaceAll('"','""')+'"',rows=[['キャラ名','キャラID','表示番号','サイズ段階','基準高さpx','画像幅px','画像高さpx','変身専用'],...visible.map(r=>[r.name,r.id,r.displayNumber,r.tier||'個別',r.targetHeight,r.width,r.height,r.hidden?'はい':'いいえ'])],url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='character-sizes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('stamp').textContent='更新 '+catalogData.generatedAt+' / 全員の待機をゲームの描画処理から出力。画像込みのため、このHTMLだけでもオフラインで開けます。';$('search').value=new URLSearchParams(location.search).get('q')||'';render();
</script></body></html>
